# Generated by scripts/cms-config.mjs on every build. Edit that file, not this one.
backend:
  name: github
  repo: xamidovasadbekdev-arch/Personal_blog
  branch: main
  commit_messages:
    create: Create {{collection}} “{{slug}}” (via CMS)
    update: Update {{collection}} “{{slug}}” (via CMS)
    delete: Delete {{collection}} “{{slug}}” (via CMS)
    uploadMedia: Upload “{{path}}” (via CMS)
    deleteMedia: Delete “{{path}}” (via CMS)
site_url: https://xamidovasadbek.dev
display_url: https://xamidovasadbek.dev
media_folder: public/uploads
public_folder: /uploads
i18n:
  structure: multiple_folders
  locales:
    - en
    - uz
  default_locale: en
collections:
  - name: articles
    label: Articles
    label_singular: Article
    description: Blog posts. Write the English version first; the Uzbek version is
      optional and falls back to English.
    folder: src/content/blog
    extension: md
    format: yaml-frontmatter
    create: true
    delete: true
    i18n: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} · {{date}}"
    sortable_fields:
      - date
      - title
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: excerpt
        label: Excerpt
        widget: text
        i18n: true
        hint: One or two sentences for lists and link previews.
      - name: date
        label: Date
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
        i18n: duplicate
      - name: category
        label: Category
        widget: select
        options:
          - label: Machine Learning & AI
            value: ml
          - label: Backend & Architecture
            value: backend
          - label: Data Science & Analytics
            value: datascience
          - label: Personal & Life
            value: personal
        i18n: duplicate
      - name: subcategory
        label: Topic
        widget: select
        required: false
        options:
          - Supervised Learning
          - Unsupervised Learning
          - Deep Learning
          - NLP & LLMs
          - FastAPI & Microservices
          - Databases & SQL
          - Distributed Systems
          - Caching & Performance
          - Exploratory Data Analysis
          - Pandas & Pipelines
          - Data Visualization
          - Achievements & Medals
          - University & WIUT
          - Career Journey
          - Sports & Football
        hint: Pick a topic that belongs to the chosen category.
        i18n: duplicate
      - name: tags
        label: Tags
        widget: list
        required: false
        i18n: duplicate
      - name: draft
        label: Draft (hidden from the site)
        widget: boolean
        default: false
        required: false
        i18n: duplicate
      - name: body
        label: Body
        widget: markdown
        i18n: true
  - name: site
    label: Site content
    description: Profile, projects, timeline, skills, blog categories and every
      piece of UI text.
    files:
      - name: profile
        label: Profile
        file: src/content/site/profile.json
        format: json
        fields:
          - name: name
            label: Name
            widget: string
          - name: headline
            label: Headline
            widget: object
            fields:
