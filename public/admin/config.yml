                label: English
                widget: string
              - name: uz
                label: O'zbekcha
                widget: string
          - name: subtitle
            label: Intro (home page)
            widget: object
            fields:
              - name: en
                label: English
                widget: text
              - name: uz
                label: O'zbekcha
                widget: text
          - name: bio
            label: Bio paragraphs
            widget: list
            fields:
              - name: en
                label: English
                widget: text
              - name: uz
                label: O'zbekcha
                widget: text
          - name: location
            label: Location
            widget: object
