              - name: en
                label: English
                widget: string
              - name: uz
                label: O'zbekcha
                widget: string
          - name: email
            label: Email
            widget: string
          - name: telegram
            label: Telegram username
            widget: string
          - name: telegramUrl
            label: Telegram URL
            widget: string
          - name: linkedin
            label: LinkedIn URL
            widget: string
          - name: github
            label: GitHub URL
            widget: string
          - name: resume
            label: Résumé file
            widget: file
            hint: Upload a PDF; the About page download button uses it.
          - name: terminalStack
            label: "Terminal card: stack lines"
            widget: list
            summary: "{{fields.value}}"
            fields:
              - name: label
                label: Label
                widget: object
                fields:
                  - name: en
                    label: English
                    widget: string
                  - name: uz
                    label: O'zbekcha
                    widget: string
              - name: value
                label: Value
                widget: string
      - name: projects
        label: Projects
        file: src/content/site/projects.json
        format: json
        fields:
          - name: items
            label: Projects
            label_singular: Project
            widget: list
            summary: "{{fields.title.en}}"
            fields:
              - name: id
                label: ID
                widget: string
                hint: Short unique name used in the URL, e.g. car-price-api.
              - name: title
                label: Title
                widget: object
