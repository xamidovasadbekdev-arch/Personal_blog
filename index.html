    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong colors.
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.classList.replace('dark', 'light');
        }
      } catch (e) {}
    </script>
